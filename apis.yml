aid: cisco-aci
name: Cisco ACI
description: 'Cisco Application Centric Infrastructure (ACI) is Cisco''s data-center SDN fabric, programmed through
  the APIC controller''s REST API and its object model (the Management Information Tree). Cisco documents the APIC
  REST API on DevNet and ships Ansible collections, a Terraform provider and a community MCP server against it.
  The API is model-driven rather than OpenAPI-described: Cisco publishes the object model reference, not a machine-readable
  contract.'
