aid: cisco-aci
name: Cisco ACI
description: 'Cisco Application Centric Infrastructure (ACI) is Cisco''s data-center SDN fabric, programmed
  through the Application Policy Infrastructure Controller (APIC) and its object model, the Management Information
  Tree (MIT). Every APIC GUI, CLI and SDK action is executed through one REST interface: HTTPS requests to
  /api/mo/<dn>.json and /api/class/<class>.json on the customer-operated controller, authenticated with a
  cookie-based aaaLogin session token and refreshed with aaaRefresh. The API is model-driven rather than
  OpenAPI-described — Cisco publishes an exhaustive object-model reference (the APIC Management Information
  Model Reference) plus a REST API configuration guide, a WebSocket (RFC 6455) event-subscription surface, an
  Ansible collection, a Terraform provider, a Python SDK (Cobra) and a public Postman workspace, but no
  anonymously fetchable OpenAPI, AsyncAPI or GraphQL contract.'
