write_operations: true
write_note: >-
  This server is not read-only. It exposes tenant, EPG and contract deletion (aci_tenant_delete,
  aci_epg_delete, aci_contract_delete) and composite provisioning tools (aci_create_3tier_app,
  aci_create_web_app_stack) that write many managed objects in one call, against a production data-center
  fabric, using whatever privileges the configured APIC account holds.
