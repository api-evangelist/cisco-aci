name: Community MCP Server for Cisco ACI
status: published
official: false
official_note: >-
  The repository lives in the CiscoDevNet GitHub organization, but its own README states plainly: "This is a
  community based project and is not officially supported by any Cisco Business or Technical entity." Treated
  as community, not first-party.
description: >-
  A stand-alone FastMCP server that sits between an MCP client and a customer's Cisco APIC controller,
  exposing ACI policy and fabric operations as MCP tools. It authenticates to the APIC with cookie-based
  aaaLogin session auth, re-authenticates transparently on HTTP 403, and calls the same
  /api/node/class/... and /api/node/mo/... REST endpoints a human would.
deployment:
  mode: local-stdio
  endpoint: null
  install: "git clone https://github.com/CiscoDevNet/mcp_server_cisco_aci_community && ./setup.sh  # then: cd scripts && python3 server.py"
  package: https://github.com/CiscoDevNet/mcp_server_cisco_aci_community
  auth: api-key
  auth_note: >-
    Not an MCP-layer auth scheme. The server reads APIC_URL, USERNAME and PASSWORD from scripts/.env and
    performs an APIC aaaLogin, so the operator supplies controller credentials at install time. There is no
    OAuth, no token issuance, and no anonymous mode.
  verified: searched
  verified_note: >-
    Established by reading the published repository (README.md, AGENTS.md and scripts/server.py) on
    2026-08-19. No live tools/list handshake was possible — the server is stdio-only and requires a reachable
    APIC, so there is no hosted endpoint to POST to.
  transports:
  - stdio
  requirements:
  - Python 3.13+
  - Reachable Cisco APIC (on-premises or DevNet sandbox)
  - An APIC user with read and/or write privileges
  dependencies:
  - fastmcp
  - httpx
  - python-dotenv
  - pydantic
  - requests
  clients_documented:
