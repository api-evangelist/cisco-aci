rest_only:
- note: 'Not enumerable. The APIC REST API is addressed by managed-object class and distinguished name over the
    whole Management Information Tree (see https://developer.cisco.com/site/apic-mim-ref-api/), not by a fixed operation
    list, so a complete rest_only[] cannot be derived without a spec. What is measurable: the MCP server touches
    20 distinct MO classes (fvTenant, fvAp, fvAEPg, fvBD, fvCtx, fvSubnet, vzBrCP, vzSubj, vzFilter, vzEntry, fvCEp,
    faultSummary, fabricNode, fabricHealthTotal, fabricLink, l1PhysIf, ethpmPhysIf, fvnsVlanInstP, physDomP, l3extOut,
    l3extInstP, bgpPeerEntry) out of the full model.'
