note: >-
  ACI has no API changelog. It has product release notes, one document per release, each opening with a
  dated "New and Changed Information" table recording every revision to that document. The entries below are
  transcribed from those tables as read on 2026-08-19. Two trains are live in parallel: 6.2(x), the current
  feature train, and 6.1(x), still receiving maintenance releases — 6.1(6f) shipped on 2026-08-14, seven
  months after 6.2(1g).
cadence: >-
  Roughly quarterly patch releases per train, with documentation revisions between them. Release notes are
  updated in place, so the dated table is the real change record.
machine_readable: false
machine_readable_note: >-
  No RSS/Atom feed, no JSON changelog and no versioned API diff. The release-notes index page itself renders
  its list client-side, so even the list of releases is not crawlable — the individual release-note URLs are
  the only stable, fetchable artifacts.
