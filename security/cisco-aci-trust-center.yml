note: >-
  The automated trust-center probe (probe-security-programs.py) returned no hit for this slug, because
  Cisco's trust surface is not at trust.cisco.com or /trust — it is split across the Trust Center, a separate
  Trust Portal on its own hostname, and the Global Government Certifications pages where the
  product-specific certifications actually live. All four were fetched and verified by hand on 2026-08-19.
  The certifications recorded below name Cisco ACI / APIC explicitly; Cisco-wide programs that do not name
  this product are noted as such rather than credited to it.
