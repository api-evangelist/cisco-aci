generated: '2026-08-19'
method: probed
source: https://www.cisco.com/.well-known/security.txt
note: >-
  Probed every /.well-known/ path plus /llms.txt against both hosts that serve Cisco ACI's public surface:
  developer.cisco.com (the DevNet ACI developer center) and www.cisco.com (the corporate/product host). The
  ACI API itself has no public host — the APIC controller is customer-operated — so the DevNet always-on
  sandbox host sandboxapicdc.cisco.com was probed as the closest live API host. Two real documents were
  found and saved: an RFC 9116 security.txt (PGP-signed, Cisco PSIRT) and an llms.txt listing Cisco's data
  center priority pages, with Application Centric Infrastructure as the first entry.
hosts:
