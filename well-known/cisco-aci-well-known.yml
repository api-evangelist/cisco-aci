findings:
- id: security-txt-served
  observed: true
  detail: >-
    RFC 9116 security.txt served at https://www.cisco.com/.well-known/security.txt, PGP-signed, with
    Contact mailto:psirt@cisco.com, an Encryption key URL, a Policy URL and a CSAF pointer. Expires
    2027-01-01.
- id: llms-txt-served
  observed: true
  detail: >-
    https://www.cisco.com/llms.txt is a real 1,196-byte text/plain llms.txt naming five data-center
    priority pages, Application Centric Infrastructure first.
- id: llms-txt-markdown-twins-404
  observed: true
  detail: >-
    Every entry in Cisco's llms.txt links to an `index.html.md` markdown twin. The ACI twin —
    https://www.cisco.com/site/us/en/products/networking/cloud-networking/application-centric-infrastructure/index.html.md
    — returned HTTP 404 on 2026-08-19 while the .html page it mirrors returned 200. The llms.txt advertises
    an agent-readable surface that is not being served.
- id: no-agent-card
  observed: false
  detail: >-
    No A2A agent card at /.well-known/agent-card.json or the legacy /.well-known/agent.json on any of the
    three hosts. No a2a/ artifact was written.
