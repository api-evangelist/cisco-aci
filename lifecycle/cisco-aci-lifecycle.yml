note: >-
  ACI's API lifecycle is the product lifecycle. There is no independently versioned API to deprecate: the
  contract is the object model of the installed APIC release, so "API deprecation" for ACI means a managed
  object class or property changing between release trains, announced in the per-release "Changes in
  behavior" section of the release notes rather than in an API changelog.
